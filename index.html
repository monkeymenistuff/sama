
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sama Museum</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #120b16;
  color: #f4ead7;
  font-family: Georgia, serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

/* PASSWORD ENTRANCE */

#gate {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(
    circle,
    #4f2b6f,
    #120b16 70%
  );
}

.gateBox {
  width: 100%;
  max-width: 420px;
  background: #24152b;
  border: 2px solid #d6b36d;
  border-radius: 16px;
  padding: 35px;
  text-align: center;
  box-shadow: 0 0 35px #d6b36d40;
}

.gateBox h1 {
  color: #d6b36d;
}

.gateBox input {
  width: 100%;
  padding: 13px;
  margin: 15px 0 12px;
  border: 1px solid #d6b36d;
  border-radius: 8px;
  background: #120b16;
  color: white;
}

.goldButton {
  border: 0;
  border-radius: 8px;
  background: #d6b36d;
  color: #24152b;
  font-weight: bold;
  padding: 11px 17px;
}

.gateBox .goldButton {
  width: 100%;
}

#wrong {
  color: #ff7777;
  display: none;
}

/* MAIN MUSEUM */

#museum {
  display: none;
}

/* ARTIST BANNER */

.museumHeader {
  padding: 0;
  margin: 0;
  background: #120b16;
  border-bottom: 2px solid #d6b36d;
}

.museumBanner {
  display: block;
  width: 100%;
  height: auto;
}

/* SIDEBAR + LAYOUT */

.layout {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 28px;
  padding: 30px 20px;
}

.sidebar {
  background: #24152b;
  border: 1px solid #70507a;
  border-radius: 12px;
  padding: 18px;
  height: max-content;
}

.sidebar h2 {
  font-size: 18px;
  color: #d6b36d;
  margin: 0 0 15px;
}

.navButton {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: #f4ead7;
  border: 1px solid transparent;
  padding: 13px;
  border-radius: 8px;
  margin-bottom: 8px;
}

.navButton:hover,
.navButton.active {
  background: #432952;
  border-color: #d6b36d;
}

/* COLLECTIONS */

.sectionTitle {
  text-align: center;
  font-size: 30px;
  color: #d6b36d;
  margin: 5px 0 12px;
}

.sectionDescription {
  text-align: center;
  color: #cbbcd0;
  font-style: italic;
  margin-bottom: 30px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(250px, 1fr)
  );
  gap: 26px;
}

.frame {
  background: #24152b;
  border: 12px solid #5a3d24;
  border-radius: 5px;
  padding: 8px;
  box-shadow:
    0 8px 25px #0008,
    inset 0 0 0 2px #d6b36d;
}

.artImage {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: #0d0810;
}

.plaque {
  background: #e4d2ae;
  color: #24152b;
  padding: 15px;
  margin-top: 10px;
  text-align: center;
}

.plaque h2 {
  margin: 0 0 7px;
  font-size: 20px;
  overflow-wrap: anywhere;
}

.plaque p {
  margin: 0;
  font-size: 14px;
}

.artDescription {
  margin-top: 10px !important;
  font-style: italic;
  line-height: 1.5;
  color: #5a4055;
}

#season2Section {
  display: none;
}

.empty {
  color: #b7a6c0;
  font-style: italic;
  text-align: center;
}

footer {
  text-align: center;
  padding: 36px 20px;
  border-top: 1px solid #3c2945;
  color: #9e8eaa;
}

/* MOBILE */

@media (max-width: 720px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sidebar h2 {
    width: 100%;
  }

  .navButton {
    width: auto;
    flex: 1;
    margin: 0;
  }

  .gallery {
    grid-template-columns: 1fr;
  }

  .gateBox h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<!-- PASSWORD GATE -->

<div id="gate">
  <div class="gateBox">
    <h1>👑 SAMA MUSEUM</h1>
    <p>The Official Senyu Huang Collection</p>

    <input
      id="pass"
      type="password"
      placeholder="Enter museum password"
    >

    <button id="enterBtn" class="goldButton">
      Enter Museum
    </button>

    <p id="wrong">❌ Incorrect password</p>
  </div>
</div>

<!-- MAIN MUSEUM -->

<div id="museum">

  <!-- ARTIST BANNER -->

  <header class="museumHeader">
    <img
      src="artist.webp"
      alt="Sama Museum — The Official Senyu Huang Collection"
      class="museumBanner"
    >
  </header>

  <div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">
      <h2>Explore</h2>

      <button
        id="originalTab"
        class="navButton active"
      >
        🖼️ The Collection
      </button>

      <button
        id="season2Tab"
        class="navButton"
      >
        ✨ Sama Season 2
      </button>
    </aside>

    <main>

      <!-- ORIGINAL COLLECTION -->

      <section id="originalSection">

        <h2 class="sectionTitle">
          The Original Collection
        </h2>

        <p class="sectionDescription">
          Where the legend first began.
        </p>

        <div id="gallery" class="gallery"></div>

      </section>

      <!-- SAMA SEASON 2 -->

      <section id="season2Section">

        <h2 class="sectionTitle">
          Sama Season 2
        </h2>

        <p class="sectionDescription">
          Six extraordinary masterpieces.
          One unforgettable legend.
          The saga continues.
        </p>

        <div id="season2Gallery" class="gallery"></div>

        <p id="season2Empty" class="empty">
          No pictures yet.
        </p>

      </section>

    </main>
  </div>

  <footer>
    👑 Curated by Senyu Huang • The Sama Museum
  </footer>

</div>

<script>

// ==========================================
// MUSEUM PASSWORD
// ==========================================

// This is only a visual entrance screen.
// The password can be seen in the page source.

const MUSEUM_PASSWORD = "bigdaddyhuangjiba123";

const $ = id => document.getElementById(id);

function enterMuseum() {

  if ($("pass").value === MUSEUM_PASSWORD) {

    $("gate").style.display = "none";
    $("museum").style.display = "block";
    $("wrong").style.display = "none";

  } else {

    $("wrong").style.display = "block";

  }
}

$("enterBtn").onclick = enterMuseum;

$("pass").addEventListener("keydown", event => {

  if (event.key === "Enter") {
    enterMuseum();
  }

});

// ==========================================
// SIDEBAR NAVIGATION
// ==========================================

function showSection(isSeason2) {

  $("originalSection").style.display =
    isSeason2 ? "none" : "block";

  $("season2Section").style.display =
    isSeason2 ? "block" : "none";

  $("originalTab").classList.toggle(
    "active",
    !isSeason2
  );

  $("season2Tab").classList.toggle(
    "active",
    isSeason2
  );

}

$("originalTab").onclick = () => showSection(false);
$("season2Tab").onclick = () => showSection(true);

// ==========================================
// ORIGINAL COLLECTION
// ==========================================

const originalArts = [

  {
    title: "Birthday Monkey",
    image: "birthday.webp"
  },

  {
    title: "Megamind",
    image: "megamind.webp"
  },

  {
    title: "Knee Eater",
    image: "knee.webp"
  },

  {
    title: "Monkey Trying to Break Out",
    image: "breakout.webp"
  },

  {
    title: "Curious Monkey",
    image: "curious.webp"
  },

  {
    title: "Awwww... Baby Monkey!",
    image: "baby.webp"
  },

  {
    title: "Confused Monkey",
    image: "confused.webp"
  }

];

// ==========================================
// SAMA SEASON 2
// ==========================================
//
// Upload pictures to GitHub first.
// Add new entries here.
// ==========================================

const season2Arts = [

  {
    title: "The Face of Pure Terror",
    image: "scared.webp",
    description:
      "A rare portrait capturing the exact moment when courage officially left the room."
  },

  {
    title: "The Divine Revelation",
    image: "religious.webp",
    description:
      "An extraordinary display of spiritual enlightenment. Historians remain unsure what was revealed."
  },

  {
    title: "The Ritual of Eternal Love",
    image: "mating.webp",
    description:
      "A fascinating study of romance, instinct, and the questionable decisions of nature."
  },

  {
    title: "The Unbreakable Aura",
    image: "tuff.webp",
    description:
      "An overwhelming display of confidence. Scientists estimate the aura levels to be immeasurable."
  },

  {
    title: "The Grand Scriptmaster",
    image: "scriptmaster.webp",
    description:
      "A mysterious mastermind believed to control the very code of reality itself."
  },

  {
    title: "The Renaissance Supermodel",
    image: "model.webp",
    description:
      "A timeless icon of elegance, beauty, and absolutely unmatched photogenic excellence."
  }

];

// ==========================================
// CREATE ARTWORK CARD
// ==========================================

function createCard(art, target) {

  const frame = document.createElement("article");
  frame.className = "frame";

  // IMAGE

  const img = document.createElement("img");

  img.className = "artImage";
  img.src = art.image;
  img.alt = art.title;
  img.loading = "lazy";

  // PLAQUE

  const plaque = document.createElement("div");
  plaque.className = "plaque";

  const heading = document.createElement("h2");
  heading.textContent = art.title;

  const subtitle = document.createElement("p");
  subtitle.textContent = "The Sama Collection";

  plaque.append(heading, subtitle);

  // OPTIONAL DESCRIPTION

  if (art.description) {

    const description = document.createElement("p");

    description.className = "artDescription";
    description.textContent = art.description;

    plaque.appendChild(description);

  }

  frame.append(img, plaque);
  target.appendChild(frame);

}

// ==========================================
// LOAD COLLECTIONS
// ==========================================

originalArts.forEach(art => {

  createCard(
    art,
    $("gallery")
  );

});

season2Arts.forEach(art => {

  createCard(
    art,
    $("season2Gallery")
  );

});

// EMPTY COLLECTION MESSAGE

$("season2Empty").style.display =
  season2Arts.length ? "none" : "block";

</script>

</body>
</html>
