
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sama Museum</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#120b16;color:#f4ead7;font-family:Georgia,serif}
button,input,select{font:inherit}
button{cursor:pointer}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,#4f2b6f,#120b16 70%)}
.gateBox{width:100%;max-width:420px;background:#24152b;border:2px solid #d6b36d;border-radius:16px;padding:35px;text-align:center;box-shadow:0 0 35px #d6b36d40}
.gateBox h1,header h1,.sectionTitle{color:#d6b36d}
.gateBox input{width:100%;padding:13px;margin:15px 0 12px;border:1px solid #d6b36d;border-radius:8px;background:#120b16;color:white}
.goldButton,.rateButton{border:0;border-radius:8px;background:#d6b36d;color:#24152b;font-weight:bold;padding:11px 17px}
.gateBox .goldButton{width:100%}
#wrong{color:#ff7777;display:none}
#museum{display:none}
header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#34194b,#170d23);border-bottom:2px solid #d6b36d}
header h1{font-size:40px;margin:0}
header p{color:#d8cbb9}
.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:30px 20px}
.sidebar{background:#24152b;border:1px solid #70507a;border-radius:12px;padding:18px;height:max-content}
.sidebar h2{font-size:18px;color:#d6b36d;margin:0 0 15px}
.navButton{display:block;width:100%;text-align:left;background:transparent;color:#f4ead7;border:1px solid transparent;padding:13px;border-radius:8px;margin-bottom:8px}
.navButton:hover,.navButton.active{background:#432952;border-color:#d6b36d}
.sectionTitle{text-align:center;font-size:30px;margin:5px 0 28px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px}
.frame{background:#24152b;border:12px solid #5a3d24;border-radius:5px;padding:8px;box-shadow:0 8px 25px #0008,inset 0 0 0 2px #d6b36d}
.artImage{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0d0810}
.plaque{background:#e4d2ae;color:#24152b;padding:15px;margin-top:10px;text-align:center}
.plaque h2{margin:0 0 7px;font-size:20px;overflow-wrap:anywhere}
.plaque p{margin:0;font-size:14px}
.rating{text-align:center;margin-top:12px}
.ratingAverage{font-size:18px;font-weight:bold;color:#d6b36d}
.ratingCount{font-size:14px;margin:5px 0 10px}
.rating select{padding:8px;border-radius:6px;background:#120b16;color:white;border:1px solid #d6b36d}
.rateButton{padding:9px 13px;margin-left:5px}
#newSection{display:none}
.empty{color:#b7a6c0;font-style:italic;text-align:center}
footer{text-align:center;padding:36px 20px;border-top:1px solid #3c2945;color:#9e8eaa}
@media(max-width:720px){
.layout{grid-template-columns:1fr}
.sidebar{display:flex;flex-wrap:wrap;gap:8px}
.sidebar h2{width:100%}
.navButton{width:auto;flex:1;margin:0}
header h1{font-size:30px}
.gallery{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gateBox">
    <h1>👑 SAMA MUSEUM</h1>
    <p>The Official Senyu Huang Collection</p>
    <input id="pass" type="password" placeholder="Enter museum password">
    <button id="enterBtn" class="goldButton">Enter Museum</button>
    <p id="wrong">❌ Incorrect password</p>
  </div>
</div>

<div id="museum">
  <header>
    <h1>👑 SAMA MUSEUM</h1>
    <p>The Official Senyu Huang Collection</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Explore</h2>
      <button id="originalTab" class="navButton active">
        🖼️ The Collection
      </button>
      <button id="newTab" class="navButton">
        ＋ New Collection
      </button>
    </aside>

    <main>
      <section id="originalSection">
        <h2 class="sectionTitle">The Collection</h2>
        <div id="gallery" class="gallery"></div>
      </section>

      <section id="newSection">
        <h2 class="sectionTitle">New Collection</h2>
        <div id="newGallery" class="gallery"></div>
        <p id="newEmpty" class="empty">
          No new pictures yet. Add them through GitHub!
        </p>
      </section>
    </main>
  </div>

  <footer>
    👑 Curated by Senyu Huang • The Sama Museum
  </footer>
</div>

<script type="module">
import {initializeApp}
  from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  query,
  where,
  onSnapshot
} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAFIRu6eAE4-zseVJLFH1DeRD0RCdH_mxQ',
  authDomain: 'sama-pics-a3cf6.firebaseapp.com',
  projectId: 'sama-pics-a3cf6',
  storageBucket: 'sama-pics-a3cf6.firebasestorage.app',
  messagingSenderId: '407213655664',
  appId: '1:407213655664:web:200f0e35402f6b139ed6b5',
  measurementId: 'G-478W5P7WX8'
};

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

// MUSEUM PASSWORD
// This is a simple entrance screen, not secure authentication.
const MUSEUM_PASSWORD = 'bigdaddyhuangjiba123';

function enter() {
  if ($('pass').value === MUSEUM_PASSWORD) {
    $('gate').style.display = 'none';
    $('museum').style.display = 'block';
  } else {
    $('wrong').style.display = 'block';
  }
}

$('enterBtn').onclick = enter;

$('pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') enter();
});

// SIDEBAR NAVIGATION
function showSection(isNew) {
  $('originalSection').style.display = isNew ? 'none' : 'block';
  $('newSection').style.display = isNew ? 'block' : 'none';

  $('originalTab').classList.toggle('active', !isNew);
  $('newTab').classList.toggle('active', isNew);
}

$('originalTab').onclick = () => showSection(false);
$('newTab').onclick = () => showSection(true);

// ORIGINAL COLLECTION
// Keep these images in the same folder as index.html.

const originalArts = [
  {
    id: 'birthday',
    title: 'Birthday Monkey',
    image: 'birthday.webp'
  },
  {
    id: 'megamind',
    title: 'Megamind',
    image: 'megamind.webp'
  },
  {
    id: 'knee',
    title: 'Knee Eater',
    image: 'knee.webp'
  },
  {
    id: 'breakout',
    title: 'Monkey Trying to Break Out',
    image: 'breakout.webp'
  },
  {
    id: 'curious',
    title: 'Curious Monkey',
    image: 'curious.webp'
  },
  {
    id: 'baby',
    title: 'Awwww... Baby Monkey!',
    image: 'baby.webp'
  },
  {
    id: 'confused',
    title: 'Confused Monkey',
    image: 'confused.webp'
  }
];

// ==================================================
// NEW COLLECTION — ADD YOUR NEW PICTURES HERE!
// ==================================================
//
// HOW TO ADD A PICTURE:
//
// 1. Upload the image to your GitHub repository.
// 2. Add an entry to newArts below.
// 3. Give every picture a UNIQUE id.
// 4. Make sure the filename matches EXACTLY.
// 5. Commit your changes.
//
// EXAMPLE:
//
// {
//   id: 'golden-monkey',
//   title: 'Golden Monkey',
//   image: 'golden-monkey.png'
// },
//
// If your images are inside a folder called "images",
// use: image: 'images/golden-monkey.png'
//
// ==================================================

const newArts = [

  // ADD NEW PICTURES HERE

];

// DEVICE ID FOR RATINGS
let device = localStorage.getItem('samaDevice');

if (!device) {
  device = crypto.randomUUID();
  localStorage.setItem('samaDevice', device);
}

// CREATE ARTWORK CARDS
function createCard(art, target) {
  const frame = document.createElement('article');
  frame.className = 'frame';

  const img = document.createElement('img');
  img.className = 'artImage';
  img.src = art.image;
  img.alt = art.title;
  img.loading = 'lazy';

  const plaque = document.createElement('div');
  plaque.className = 'plaque';

  const heading = document.createElement('h2');
  heading.textContent = art.title;

  const sub = document.createElement('p');
  sub.textContent = 'The Sama Collection';

  plaque.append(heading, sub);

  const rating = document.createElement('div');
  rating.className = 'rating';

  const avg = document.createElement('div');
  avg.className = 'ratingAverage';
  avg.textContent = '0.0 / 10';

  const count = document.createElement('div');
  count.className = 'ratingCount';
  count.textContent = '⭐ 0 ratings';

  const select = document.createElement('select');
  select.setAttribute('aria-label', 'Rate ' + art.title);

  for (let i = 10; i >= 1; i--) {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = i;
    select.appendChild(option);
  }

  const button = document.createElement('button');
  button.className = 'rateButton';
  button.textContent = 'Rate';

  button.onclick = async () => {
    button.disabled = true;

    try {
      await setDoc(
        doc(db, 'ratings', art.id + '_' + device),
        {
          artwork: art.id,
          device: device,
          rating: Number(select.value)
        }
      );
    } catch (error) {
      console.error(error);
      alert('Could not submit rating. Check Firebase Firestore rules.');
    } finally {
      button.disabled = false;
    }
  };

  rating.append(avg, count, select, button);
  frame.append(img, plaque, rating);
  target.appendChild(frame);

  // LIVE FIREBASE RATINGS
  onSnapshot(
    query(
      collection(db, 'ratings'),
      where('artwork', '==', art.id)
    ),
    snap => {
      let total = 0;

      snap.forEach(d => {
        total += Number(d.data().rating) || 0;
      });

      const average = snap.size ? total / snap.size : 0;

      avg.textContent = average.toFixed(1) + ' / 10';

      count.textContent =
        '⭐ ' + snap.size +
        (snap.size === 1 ? ' rating' : ' ratings');
    },
    error => {
      console.error(error);
      count.textContent = 'Ratings unavailable';
    }
  );
}

// LOAD ORIGINAL COLLECTION
originalArts.forEach(art => {
  createCard(art, $('gallery'));
});

// LOAD NEW COLLECTION
newArts.forEach(art => {
  createCard(art, $('newGallery'));
});

// EMPTY MESSAGE
$('newEmpty').style.display =
  newArts.length ? 'none' : 'block';

</script>
</body>
</html>
